name: Release package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag, such as v0.1.0-alpha.0
        required: true
        type: string
      publish:
        description: Publish after verification
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
jobs:
  release:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: node scripts/verify-release.mjs --tag=${{ inputs.tag }}
      - if: ${{ inputs.publish }}
        run: npm publish --provenance
