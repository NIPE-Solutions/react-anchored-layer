name: Release package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag, such as v0.1.0-alpha.0
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run test:website:e2e
      - run: node scripts/verify-release.mjs --tag="${RELEASE_TAG}" --ensure-unpublished
      - if: ${{ github.event_name == 'release' }}
        run: npm publish --provenance --access public --tag alpha
